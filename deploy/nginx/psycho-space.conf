# psycho-space nginx site — TLS termination + reverse proxy to the app on :8080.
# Certificates are obtained by certbot in webroot mode (bootstrap.sh); this file
# owns the whole server config (certbot does NOT edit it).

server {
    listen 80;
    listen [::]:80;
    server_name psycho-space.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 as a listen param (compatible with nginx 1.24 on Ubuntu 24.04;
    # the `http2 on;` directive only exists in nginx >= 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psycho-space.ru;

    ssl_certificate     /etc/letsencrypt/live/psycho-space.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psycho-space.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: the VK ID SDK is bundled ('self'); allow VK ID iframe/fetch/redirect
    # across BOTH vk.ru and vk.com families (the SDK uses both). Note: the VK page's
    # own frame-ancestors (VK-controlled) must also list psycho-space.ru — that's
    # done by registering the domain on the VK app, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; connect-src 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; frame-src 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket upgrade for the realtime layer. A prefix location, so it wins
    # over `location /` by longest-prefix match. The path is deliberately
    # game-agnostic (the room is a query parameter) so a second realtime feature
    # never needs an nginx change.
    location /api/realtime {
        proxy_pass http://127.0.0.1:8080;

        # nginx 1.24 defaults proxy_http_version to 1.0, and a WebSocket
        # handshake below HTTP/1.1 is rejected by the server library — so
        # without this the upgrade fails before any of our code runs.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # proxy_set_header does NOT merge across levels: defining any header
        # here DROPS every proxy_set_header inherited from the server block. All
        # four must be repeated. Losing X-Real-IP in particular would be silent
        # and bad — clientIP() falls back to the peer address, which behind the
        # proxy is always 127.0.0.1, collapsing every client into one
        # rate-limit bucket.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle socket must not be cut at the default 60s. The application
        # pings every 25s to detect half-open TCP; these timeouts only need to
        # stay well clear of that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
