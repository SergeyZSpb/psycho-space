name: deploy

# `main` auto-deploys to the production box. The build job runs the full test
# suite (unit + integration) and only then builds the binary; the deploy job
# ships it over SSH. Feature/PR branches never deploy — they run ci.yml (tests).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  # v1.13.0 or newer: earlier releases pin golang.org/x/tools v0.24.0, whose
  # tokeninternal package does not compile under Go 1.26.
  GOTESTSUM_VERSION: v1.13.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Go tooling (golangci-lint, gotestsum)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          go install "gotest.tools/gotestsum@$GOTESTSUM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend into embed dir
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Lint (gofmt + go vet + golangci-lint)
        run: ./dev.sh lint

      - name: Web type-check
        working-directory: web
        run: npm run type-check

      - name: Web unit tests (+coverage)
        working-directory: web
        run: npx vitest run --coverage --reporter=json --outputFile=vitest-results.json --reporter=default

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Web e2e (Playwright, mobile viewports)
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npx playwright test --reporter=list,json

      - name: Unit + integration tests (+coverage)
        run: |
          mkdir -p .coverage
          gotestsum --format testname --jsonfile .coverage/unit.json \
            -- -covermode=atomic -coverprofile=.coverage/unit.out ./...
          gotestsum --format testname --jsonfile .coverage/integration.json \
            -- -tags=integration -covermode=atomic -coverpkg=./... \
               -coverprofile=.coverage/integration.out ./test/integration/...

      - name: Full-stack e2e (real binary + Postgres)
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-stack-results.json
        run: npx playwright test --config=playwright.stack.config.ts --reporter=list,json

      # Always: a failed suite is exactly when the summary is most wanted.
      - name: Test + coverage summary
        if: always()
        run: ./scripts/ci-test-summary.sh >> "$GITHUB_STEP_SUMMARY"

      # Videos are recorded for every test (video: 'on'), so the recordings are
      # here on a green run too — not only when something broke.
      - name: Upload Playwright artifacts (videos, traces, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.job }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 5
          if-no-files-found: ignore

      - name: Build linux binary (embeds SPA + migrations)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o psycho-space ./cmd/psycho-space

      - uses: actions/upload-artifact@v4
        with:
          name: psycho-space-binary
          path: psycho-space
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: psycho-space-binary

      # Until the server is provisioned and prod secrets are set, skip deploy
      # cleanly instead of failing the run.
      - name: Guard on secrets
        id: guard
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets not set yet — skipping deploy (provision the box + add prod secrets first)."
          fi

      - name: Prepare SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Render app.env from secrets
        if: steps.guard.outputs.ready == 'true'
        env:
          DB_PW: ${{ secrets.POSTGRES_PASSWORD }}
          ENC: ${{ secrets.APP_ENC_KEY }}
          HMACK: ${{ secrets.APP_HMAC_KEY }}
          SESS: ${{ secrets.APP_SESSION_KEY }}
          VK_APP_ID: ${{ secrets.VK_APP_ID }}
          VK_SVC: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_REDIR: ${{ secrets.VK_REDIRECT_URI }}
          VK_VERIFY: ${{ secrets.VK_VERIFY_IDTOKEN }}
          VK_JWKS_URL: ${{ secrets.VK_JWKS_URL }}
          VK_ISSUER: ${{ secrets.VK_ISSUER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          umask 077
          cat > app.env <<EOF
          PSYCHOSPACE_ENV=prod
          PSYCHOSPACE_HTTP_ADDR=127.0.0.1:8080
          PSYCHOSPACE_BASE_URL=https://psycho-space.ru
          PSYCHOSPACE_LOG_DIR=/var/log/psycho-space
          PSYCHOSPACE_DATABASE_URL=postgres://psychospace:${DB_PW}@127.0.0.1:5432/psychospace?sslmode=disable
          PSYCHOSPACE_ENC_KEY=${ENC}
          PSYCHOSPACE_HMAC_KEY=${HMACK}
          PSYCHOSPACE_SESSION_KEY=${SESS}
          PSYCHOSPACE_VK_APP_ID=${VK_APP_ID}
          PSYCHOSPACE_VK_SERVICE_TOKEN=${VK_SVC}
          PSYCHOSPACE_VK_REDIRECT_URI=${VK_REDIR}
          PSYCHOSPACE_VK_VERIFY_IDTOKEN=${VK_VERIFY:-false}
          PSYCHOSPACE_VK_JWKS_URL=${VK_JWKS_URL}
          PSYCHOSPACE_VK_ISSUER=${VK_ISSUER}
          PSYCHOSPACE_LLM_BASE_URL=${LLM_BASE_URL}
          PSYCHOSPACE_LLM_API_KEY=${LLM_API_KEY}
          PSYCHOSPACE_LLM_MODEL=${LLM_MODEL}
          EOF

      - name: Ship + apply
        if: steps.guard.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id -p "$PORT" "$SSH_USER@$HOST" 'rm -rf /tmp/psycho-deploy && mkdir -p /tmp/psycho-deploy'
          scp -i ~/.ssh/id -P "$PORT" \
            psycho-space app.env \
            deploy/systemd/psycho-space.service \
            deploy/nginx/psycho-space.conf \
            deploy/psycho-deploy.sh deploy/make-superadmin.sh \
            "$SSH_USER@$HOST:/tmp/psycho-deploy/"
          ssh -i ~/.ssh/id -p "$PORT" "$SSH_USER@$HOST" 'set -e
            sudo install -m0755 /tmp/psycho-deploy/psycho-deploy.sh     /usr/local/bin/psycho-deploy
            sudo install -m0755 /tmp/psycho-deploy/make-superadmin.sh   /usr/local/bin/make-superadmin
            sudo psycho-deploy'

      - name: External health gate
        if: steps.guard.outputs.ready == 'true'
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS https://psycho-space.ru/healthz; then exit 0; fi
            sleep 3
          done
          echo "external health check failed" >&2
          exit 1
