name: tests

# The whole gate, as four jobs that run at the same time.
#
# Called by both ci.yml (branches/PRs) and deploy.yml (main). It exists as a
# reusable workflow rather than as two copies because the two used to drift:
# ci.yml grew a `go build` step deploy.yml never had, and the suites ran in a
# different order in each, so "same tests, no deploy" was not quite true. One
# definition, two callers, no drift.
#
# WHY FOUR JOBS AND NOT ONE. The suites do not depend on each other — nothing in
# the Go tests needs the Playwright run to have happened — so the single job was
# just four waits in a row, and the pipeline took as long as their sum (~21 min)
# instead of as long as the slowest (~6). The jobs pay for that with their own
# checkout and toolchain setup, about a minute each, which the parallelism buys
# back many times over.
#
# Each job uploads the machine-readable results it produced; `summary` collects
# them at the end and renders the one table a person reads. It runs `if:
# always()`, because a failed suite is exactly when the summary is most wanted.

on:
  workflow_call:

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  # v1.13.0 or newer: earlier releases pin golang.org/x/tools v0.24.0, whose
  # tokeninternal package does not compile under Go 1.26.
  GOTESTSUM_VERSION: v1.13.0

jobs:
  go:
    name: Go (lint + unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both land in GOPATH/bin, which is added to PATH so `./dev.sh lint` finds
      # the same linter the pre-commit hook runs locally.
      - name: Install Go tooling (golangci-lint, gotestsum)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          go install "gotest.tools/gotestsum@$GOTESTSUM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Go build
        run: ./dev.sh build

      - name: Lint (gofmt + go vet + golangci-lint)
        run: ./dev.sh lint

      # Unit first, then integration: the integration profile is built with
      # -coverpkg=./..., so it measures what an end-to-end run reaches rather
      # than what each package tests about itself. The summary reports both.
      - name: Unit + integration tests (+coverage)
        run: |
          mkdir -p .coverage
          gotestsum --format testname --jsonfile .coverage/unit.json \
            -- -covermode=atomic -coverprofile=.coverage/unit.out ./...
          gotestsum --format testname --jsonfile .coverage/integration.json \
            -- -tags=integration -covermode=atomic -coverpkg=./... \
               -coverprofile=.coverage/integration.out ./test/integration/...

      - name: Upload Go results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-go
          path: .coverage
          retention-days: 5
          if-no-files-found: ignore

  web:
    name: Web (type-check + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Web type-check
        working-directory: web
        run: npm run type-check

      - name: Web unit tests (+coverage)
        working-directory: web
        run: npx vitest run --coverage --reporter=json --outputFile=vitest-results.json --reporter=default

      - name: Web build (catch bundling errors)
        working-directory: web
        run: npm run build

      - name: Upload web results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          path: |
            web/vitest-results.json
            web/coverage/coverage-summary.json
          retention-days: 5
          if-no-files-found: ignore

  ui:
    name: UI layout (Playwright, stubbed /api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The config's webServer builds the SPA and serves it; nothing else is
      # needed here. Everything runs at 360px; desktop runs the `@wide` tests.
      - name: UI layout suite
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npx playwright test --reporter=list,json

      - name: Upload UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ui
          path: web/e2e-results.json
          retention-days: 5
          if-no-files-found: ignore

      # Videos are recorded for every test (video: 'on'), so the recordings are
      # here on a green run too — not only when something broke.
      - name: Upload Playwright artifacts (videos, traces, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-ui
          path: |
            web/test-results
            web/playwright-report
          retention-days: 5
          if-no-files-found: ignore

  stack:
    name: Full-stack e2e (real binary + Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # scripts/e2e-stack.sh (the config's webServer) builds the SPA and the Go
      # binary, starts a real PostgreSQL, and seeds the accounts.
      - name: Full-stack e2e
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-stack-results.json
        run: npx playwright test --config=playwright.stack.config.ts --reporter=list,json

      - name: Upload full-stack results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-stack
          path: web/e2e-stack-results.json
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload Playwright artifacts (videos, traces, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-stack
          path: |
            web/test-results
            web/playwright-report
          retention-days: 5
          if-no-files-found: ignore

  summary:
    name: Test + coverage summary
    needs: [go, web, ui, stack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `go tool cover` renders the coverage percentages.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Each download restores the files to exactly the paths
      # scripts/ci-test-summary.sh expects. A missing artifact means that job
      # died before producing results; the script degrades to "-" for that row,
      # so the download must not fail the summary.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: results-go, path: .coverage }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: results-web, path: web }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: results-ui, path: web }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: results-stack, path: web }

      - name: Render summary
        run: ./scripts/ci-test-summary.sh >> "$GITHUB_STEP_SUMMARY"
