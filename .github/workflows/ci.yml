name: ci

# Feature/PR branches: run the gate only (NO deploy). `main` is the auto-deploy
# branch and is handled by deploy.yml instead.
#
# The gate itself lives in tests.yml and is shared with deploy.yml, so the two
# cannot drift: what runs here is exactly what runs before a deploy.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
